services:
  phpredisadmin:
    build: .
    environment:
      ADMIN_USER: ${ADMIN_USER:?Set ADMIN_USER before starting phpRedisAdmin}
      ADMIN_PASS: ${ADMIN_PASS:?Set ADMIN_PASS before starting phpRedisAdmin}
      REDIS_1_HOST: redis
      REDIS_1_PORT: 6379
    links:
      - redis
    ports:
      - "80:80"

  redis:
    image: redis
    command: --loglevel verbose
